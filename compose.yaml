name: karetka
services:
  app:
    build: .
    image: karetka-app:${KARETKA_RELEASE:-local}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      PORT: "8080"
      KARETKA_DB_PATH: /data/karetka.sqlite
      TRUST_CADDY_PROXY: "1"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 8s
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  app_data:
    name: ${KARETKA_DATA_VOLUME:-karetka_data}
  caddy_data:
  caddy_config:
